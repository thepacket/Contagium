# nginx's add_header does not inherit into a block that declares its own, so
# these are included per-location rather than set once on the server.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# The policy is as tight as a policy gets, because the architecture allows it:
# the catalog is bundled at build time and the app makes no network requests at
# all, so `connect-src 'none'` costs nothing and `default-src 'none'` is the
# honest default. img-src allows data: for the empty favicon in index.html.
#
# This line must match POLICY in scripts/check-csp.mjs verbatim —
# `npm run check:csp` reads this file and fails the build if the two drift.
# A CSP is invisible in dev, where none is applied, so the only place a
# mismatch would surface is production.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
